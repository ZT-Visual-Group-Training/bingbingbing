dataset: "../2026-11-13_18-25-25_462305"
output: "output/demo1.mp4"
model: "models/mnist-12.onnx"
out_width: 1280
out_height: 720
out_fps: 60
stride: 3
max_frames: 0

benchmark: false
draw: true
use_digit: true

detector:
  enemy_color: "red"
  min_saturation: 120
  min_value: 100
  red_hue_max: 28
  blue_hue_min: 90
  blue_hue_max: 135
  morph_size: 3
  min_light_area: 16
  min_light_length: 10
  min_light_ratio: 1.4
  max_light_ratio: 15
  max_tilt: 45
  min_pair_ratio: 1.3
  max_pair_ratio: 4.6
  max_angle_diff: 22
  max_y_diff_ratio: 0.7
  min_overlap_ratio: 0.45
  min_length_ratio: 0.6
  min_armor_width: 24
  min_distance: 0.3
  max_distance: 8.0
  large_ratio_thresh: 3.3
  max_reproj: 12.0
  max_armors: 4
  scale: 1
  use_roi: false
  roi_padding: 0.6

tracker:
  min_hits: 3
  max_misses: 8
  assoc_dist_ratio: 1.5
  velocity_smooth: 0.6
  digit_vote_min: 3
  digit_conf_thresh: 0.45

aimer:
  enable: true
  bullet_speed: 20.0
  gravity: 9.8
  yaw_offset: 0.0
  pitch_offset: 0.0
  max_gimbal_speed: 8.0
  fire_yaw_tol: 1.5
  fire_pitch_tol: 2.0
  fire_frames: 2
  prediction_time: 0.03
